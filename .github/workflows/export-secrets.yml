name: Export Secrets and Variables

on:
  # 手动触发，方便你随时导出
  workflow_dispatch:
  # 也可以选择其他触发方式，比如 push 到 main 分支时自动导出
  # push:
  #   branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 如果需要将文件提交到仓库，需要写权限
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export all vars/secrets to env variables
        uses: infovista-opensource/vars-to-env-action@1.0.2
        with:
          # 必填：传入所有 secrets（JSON 格式）
          secrets: ${{ toJSON(secrets) }}
          # 必填：传入所有 variables（JSON 格式）
          vars: ${{ toJSON(vars) }}
          # 可选：指定输出文件名，默认为 .env
          # file: .env.export
          # 可选：是否将环境变量添加到 GITHUB_ENV，默认为 false
          add-to-env: false

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: .env
          # 文件只保留 7 天，之后自动删除
          retention-days: 7

      # 可选：如果你想把 .env 文件提交到仓库（不推荐，因为 secret 会暴露在 Git 历史中）
      # - name: Commit .env file (⚠️ NOT RECOMMENDED for security)
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
