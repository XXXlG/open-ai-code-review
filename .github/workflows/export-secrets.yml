name: Export Secrets and Variables

on:
  # 手动触发，方便你随时导出
  workflow_dispatch:
  # 也可以选择其他触发方式，比如 push 到 main 分支时自动导出
  # push:
  #   branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 如果需要将文件提交到仓库，需要写权限
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export all secrets to .env file
        uses: infovista-opensource/vars-to-env-action@v1
        with:
          # 必填：传入所有 secrets（JSON 格式）
          secrets: ${{ toJSON(secrets) }}
          # 必填：传入所有 variables（JSON 格式）
          file: .env.export

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: .env.export
          # 文件只保留 7 天，之后自动删除
          retention-days: 7
