name: Export Secrets and Variables (Fixed)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env file from secrets and vars
        id: generate
        run: |
          # 清空并写入文件头
          echo "# Exported from GitHub Actions" > .env.export
          echo "# Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .env.export
          echo "" >> .env.export
          
          # 导出所有 Variables
          echo "## Variables" >> .env.export
          if [ "${{ toJSON(vars) }}" != "{}" ]; then
            echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No variables defined" >> .env.export
          fi
          
          echo "" >> .env.export
          
          # 导出所有 Secrets
          echo "## Secrets" >> .env.export
          if [ "${{ toJSON(secrets) }}" != "{}" ]; then
            echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No secrets defined" >> .env.export
          fi
          
          # 验证文件
          if [ -f ".env.export" ]; then
            echo "✅ .env.export created successfully"
            echo "File size: $(wc -c < .env.export) bytes"
            echo "File path: $(pwd)/.env.export"
          else
            echo "❌ File creation failed"
            exit 1
          fi

      # ===== 新增：在上传前再次确认文件 =====
      - name: Verify file before upload
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in current directory ==="
          ls -la
          echo "=== Check .env.export specifically ==="
          if [ -f ".env.export" ]; then
            echo "✅ .env.export exists in $(pwd)"
            cat .env.export | head -5
          else
            echo "❌ .env.export NOT found"
            # 尝试在更广的范围查找
            find . -name ".env.export" -type f 2>/dev/null || echo "Not found anywhere"
          fi

      # ===== 使用通配符上传（更宽容） =====
      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: |
            **/.env.export
            .env.export
          retention-days: 7
          if-no-files-found: error  # 改为 error，如果还没有文件就明确失败
