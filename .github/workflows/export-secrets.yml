name: Export Secrets and Variables

on:
  workflow_dispatch:  # 手动触发

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export all vars/secrets to env variables
        uses: infovista-opensource/vars-to-env-action@1.0.2
        with:
          secrets: ${{ toJSON(secrets) }}  # 必填：传入所有 secrets
          vars: ${{ toJSON(vars) }}        # ⚠️ 新增：传入所有 variables（这是关键！）
          file: .env.export                # 指定输出文件名

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: .env.export
          retention-days: 7
