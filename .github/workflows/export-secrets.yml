name: Export Secrets and Variables (Native)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== 核心：使用原生命令生成 .env 文件 =====
      - name: Generate .env file from secrets and vars
        run: |
          # 清空并写入文件头
          echo "# Exported from GitHub Actions" > .env.export
          echo "# Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .env.export
          echo "" >> .env.export
          
          # 导出所有 Variables（非敏感配置）
          echo "## Variables" >> .env.export
          if [ "${{ toJSON(vars) }}" != "{}" ]; then
            echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No variables defined" >> .env.export
          fi
          
          echo "" >> .env.export
          
          # 导出所有 Secrets（⚠️ 敏感信息，仅用于临时导出）
          echo "## Secrets" >> .env.export
          if [ "${{ toJSON(secrets) }}" != "{}" ]; then
            echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No secrets defined" >> .env.export
          fi
          
          # 验证文件是否生成成功
          if [ -f ".env.export" ]; then
            echo "✅ .env.export created successfully"
            echo "File size: $(wc -c < .env.export) bytes"
            echo "=== Keys exported (first 10) ==="
            cat .env.export | grep -v '^#' | grep -v '^$' | cut -d'=' -f1 | head -10
          else
            echo "❌ Failed to create .env.export"
            exit 1
          fi

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: .env.export
          retention-days: 7
