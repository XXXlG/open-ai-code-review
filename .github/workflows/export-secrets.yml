name: Export Secrets and Variables (Native)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env file from secrets and vars
        run: |
          # 清空并写入文件头
          echo "# Exported from GitHub Actions" > .env.export
          echo "# Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .env.export
          echo "" >> .env.export
          
          # 导出所有 Variables
          echo "## Variables" >> .env.export
          if [ "${{ toJSON(vars) }}" != "{}" ]; then
            echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No variables defined" >> .env.export
          fi
          
          echo "" >> .env.export
          
          # 导出所有 Secrets
          echo "## Secrets" >> .env.export
          if [ "${{ toJSON(secrets) }}" != "{}" ]; then
            echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.export
          else
            echo "# No secrets defined" >> .env.export
          fi
          
          echo "✅ .env.export created successfully at: $(pwd)/.env.export"

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: ${{ github.workspace }}/.env.export  # 👈 使用绝对路径
          retention-days: 7
