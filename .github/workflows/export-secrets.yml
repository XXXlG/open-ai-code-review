name: Export Secrets and Variables (Debug)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== 新增：调试步骤1 - 检查输入参数 =====
      - name: 🔍 Debug - Check inputs
        run: |
          echo "=== Checking if secrets and vars are passed ==="
          echo "Secrets count: ${{ toJSON(secrets) != '{}' && 'Has secrets' || 'No secrets' }}"
          echo "Vars count: ${{ toJSON(vars) != '{}' && 'Has vars' || 'No vars' }}"
          echo ""
          echo "=== Secrets keys (first 200 chars) ==="
          echo "${{ toJSON(secrets) }}" | cut -c1-200
          echo ""
          echo "=== Vars keys (first 200 chars) ==="
          echo "${{ toJSON(vars) }}" | cut -c1-200

      - name: Export all vars/secrets to env variables
        uses: infovista-opensource/vars-to-env-action@1.0.2
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          file: .env.export

      # ===== 新增：调试步骤2 - 检查文件是否生成 =====
      - name: 🔍 Debug - Check if file was created
        run: |
          echo "=== Current working directory ==="
          pwd
          echo ""
          echo "=== All files in current directory ==="
          ls -la
          echo ""
          echo "=== Search for .env.export ==="
          if [ -f ".env.export" ]; then
            echo "✅ File .env.export exists!"
            echo "File size: $(wc -c < .env.export) bytes"
            echo "First 5 lines:"
            head -n 5 .env.export
          else
            echo "❌ File .env.export NOT found!"
            echo "Searching in parent directories..."
            find .. -name ".env.export" 2>/dev/null || echo "Not found anywhere"
          fi

      # ===== 新增：尝试手动创建文件（备用方案） =====
      - name: 🔧 Fallback - Manually create .env file
        if: always()  # 即使前面的步骤失败也执行
        run: |
          echo "# Manual fallback - Generated from secrets and vars" > .env.fallback
          echo "# Secrets:" >> .env.fallback
          echo "${{ toJSON(secrets) }}" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.fallback 2>/dev/null || echo "No secrets to export" >> .env.fallback
          echo "" >> .env.fallback
          echo "# Variables:" >> .env.fallback
          echo "${{ toJSON(vars) }}" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env.fallback 2>/dev/null || echo "No vars to export" >> .env.fallback
          echo "✅ Fallback file .env.fallback created"

      - name: Upload .env file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: |
            .env.export
            .env.fallback
          retention-days: 7
          # 如果文件不存在，不报错继续
          if-no-files-found: warn
